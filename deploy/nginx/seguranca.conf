# ------------------------------------------------------------------------
# Feijoada Porkinho — cabecalhos de seguranca
# Instalar em: /etc/nginx/snippets/porkinho-seguranca.conf
#
# POR QUE ISTO E UM ARQUIVO A PARTE:
# no nginx, um `add_header` dentro de um bloco filho DESCARTA todos os
# add_header herdados do pai. Como quase todo `location` do site define o
# proprio Cache-Control, cada um deles perdia os cabecalhos de seguranca do
# server — o CSS, o JS, as imagens e a propria pagina 404 estavam saindo sem
# CSP e sem nosniff. Em vez de repetir seis diretivas em cada bloco, elas
# ficam aqui e cada location faz `include` deste arquivo.
#
# REGRA: todo `location` que tiver QUALQUER add_header precisa incluir isto.
# ------------------------------------------------------------------------

# HSTS: so ligar depois de confirmar que o HTTPS esta redondo. Uma vez
# enviado, o navegador guarda por 2 anos e nao tem como voltar atras.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://cloudflareinsights.com; img-src 'self' data:; font-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; manifest-src 'self'" always;

# Indexacao fica por conta do <meta name="robots"> de cada pagina e do
# robots.txt. Um X-Robots-Tag global brigaria com o "noindex" do 404.
