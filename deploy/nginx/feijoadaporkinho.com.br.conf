# ------------------------------------------------------------------------
# Feijoada Porkinho — feijoadaporkinho.com.br
# Instalar em: /etc/nginx/sites-available/feijoadaporkinho.com.br.conf
#              ln -s para /etc/nginx/sites-enabled/
#
# Depende de:
#   /etc/nginx/conf.d/cloudflare-realip.conf   (gerado por update-cloudflare-ips.sh)
#   /etc/nginx/conf.d/log-cliques.conf         (log_format, contexto http)
#   /etc/nginx/snippets/cliques.conf           (rotas /go/, contexto server)
#
# CERTIFICADO — Let's Encrypt
# O certificado e publicamente confiavel, emitido pelo Let's Encrypt e
# renovado sozinho pelo timer do certbot. Por ser confiavel, funciona com o
# SSL da Cloudflare em Full (strict) e continua valido se um dia o proxy for
# pausado ou o dominio sair da nuvem laranja.
#
# A renovacao usa o desafio DNS-01 (plugin dns-cloudflare), nao o HTTP-01:
# com a nuvem laranja ligada o HTTP-01 depende de a borda conseguir falar com
# a origem, o que cria uma dependencia circular justamente quando o
# certificado esta com problema. O DNS-01 resolve pela API e nao passa pela
# porta 80.
#
# Alternativa documentada: um Cloudflare Origin Certificate nos mesmos
# caminhos de /etc/ssl/cloudflare/ (ver README). So vale para trafego vindo
# da Cloudflare.
#
# NGINX 1.25.1+: trocar `listen 443 ssl http2;` por `listen 443 ssl;` mais
# `http2 on;`. Este arquivo esta escrito para o nginx 1.24 do Ubuntu 24.04.
# ------------------------------------------------------------------------

# === catch-all: Host desconhecido nao recebe resposta ====================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    return 444;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    # recusa o handshake TLS sem precisar de certificado proprio
    ssl_reject_handshake on;
    access_log off;
    return 444;
}

# === :80 -> :443 =========================================================
server {
    listen 80;
    listen [::]:80;
    server_name feijoadaporkinho.com.br www.feijoadaporkinho.com.br;

    access_log /var/log/feijoadaporkinho/access.log porkinho;
    error_log  /var/log/feijoadaporkinho/error.log warn;

    # --- desafio ACME (Let's Encrypt) ------------------------------------
    # Webroot proprio, FORA de /var/www/feijoadaporkinho/public: o deploy roda
    # `rsync --delete` naquele diretorio e apagaria o desafio no meio da
    # emissao. O prefixo `^~` e obrigatorio — sem ele o `location ~ /\.`
    # (que barra .git e .env) casaria antes e devolveria 403.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        access_log off;
    }

    # O /health responde tambem em HTTP puro: serve para monitorar a origem
    # e para o deploy.sh conferir o servidor antes de o DNS estar virado.
    location = /health {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # Este redirect fica dentro de `location /` de proposito. Um `return` no
    # nivel do server roda na fase de rewrite, ANTES da escolha do location:
    # solto aqui fora, ele atropelaria o /health acima.
    location / {
        return 301 https://feijoadaporkinho.com.br$request_uri;
    }
}

# === www -> apex =========================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.feijoadaporkinho.com.br;

    ssl_certificate     /etc/letsencrypt/live/feijoadaporkinho.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feijoadaporkinho.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Authenticated Origin Pulls (recomendado) — LIGAR EM DOIS PASSOS.
    # 1) Painel: SSL/TLS > Origin Server > Authenticated Origin Pulls = ON
    # 2) so entao descomentar as duas linhas abaixo e recarregar o nginx.
    # Na ordem invertida o nginx passa a recusar todo mundo, inclusive a
    # Cloudflare, e o site cai.
    # ssl_client_certificate /etc/ssl/cloudflare/origin-pull-ca.pem;
    # ssl_verify_client on;

    access_log /var/log/feijoadaporkinho/access.log porkinho;

    return 301 https://feijoadaporkinho.com.br$request_uri;
}

# === o site ==============================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name feijoadaporkinho.com.br;

    root  /var/www/feijoadaporkinho/public;
    index index.html;
    charset utf-8;

    # --- TLS -------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/feijoadaporkinho.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feijoadaporkinho.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # So faz sentido com certificado publicamente confiavel, como o do
    # Let's Encrypt; com o Origin Certificate da Cloudflare nao ha OCSP.
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/feijoadaporkinho.com.br/chain.pem;

    # Authenticated Origin Pulls (recomendado) — ver a nota no bloco do www:
    # ligue primeiro no painel da Cloudflare, so depois descomente aqui.
    # ssl_client_certificate /etc/ssl/cloudflare/origin-pull-ca.pem;
    # ssl_verify_client on;

    # --- logs ------------------------------------------------------------
    access_log /var/log/feijoadaporkinho/access.log porkinho;
    error_log  /var/log/feijoadaporkinho/error.log warn;

    # --- cabecalhos de seguranca -----------------------------------------
    # Todo location que definir add_header precisa repetir este include:
    # um add_header em bloco filho descarta os herdados do pai.
    include /etc/nginx/snippets/porkinho-seguranca.conf;

    # --- compressao ------------------------------------------------------
    # Brotli fica por conta da Cloudflare; aqui so o gzip.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   512;
    gzip_proxied      any;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/manifest+json image/svg+xml
               application/xml application/rss+xml;

    # --- saude -----------------------------------------------------------
    location = /health {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # --- contagem de cliques ---------------------------------------------
    # Tem que vir ANTES dos locations de estatico: os `location =` e `^~`
    # de /go/ ganham de qualquer regex, mas manter aqui deixa a leitura clara.
    include /etc/nginx/snippets/cliques.conf;

    # --- estaticos com cache busting por ?v=: cache longo ----------------
    # Sem `expires` de proposito: a diretiva emite o SEU PROPRIO
    # Cache-Control e a resposta sairia com o cabecalho duplicado.
    location ^~ /css/    { include /etc/nginx/snippets/porkinho-seguranca.conf; add_header Cache-Control "public, max-age=31536000, immutable" always; access_log off; }
    location ^~ /js/     { include /etc/nginx/snippets/porkinho-seguranca.conf; add_header Cache-Control "public, max-age=31536000, immutable" always; access_log off; }
    location ^~ /img/    { include /etc/nginx/snippets/porkinho-seguranca.conf; add_header Cache-Control "public, max-age=31536000, immutable" always; access_log off; }
    location ^~ /fonts/  { include /etc/nginx/snippets/porkinho-seguranca.conf; add_header Cache-Control "public, max-age=31536000, immutable" always; access_log off; types { font/woff2 woff2; } }

    # --- arquivos de raiz que mudam pouco --------------------------------
    location = /favicon.ico      { include /etc/nginx/snippets/porkinho-seguranca.conf; add_header Cache-Control "public, max-age=2592000" always; access_log off; }
    location = /site.webmanifest { include /etc/nginx/snippets/porkinho-seguranca.conf; default_type application/manifest+json; add_header Cache-Control "public, max-age=86400" always; }
    location = /robots.txt       { include /etc/nginx/snippets/porkinho-seguranca.conf; add_header Cache-Control "public, max-age=86400" always; access_log off; }
    location = /sitemap.xml      { include /etc/nginx/snippets/porkinho-seguranca.conf; add_header Cache-Control "public, max-age=86400" always; access_log off; }

    # --- desafio ACME (Let's Encrypt) ------------------------------------
    # Webroot proprio, FORA de /var/www/feijoadaporkinho/public: o deploy roda
    # `rsync --delete` naquele diretorio e apagaria o desafio no meio da
    # emissao. O prefixo `^~` e obrigatorio — sem ele o `location ~ /\.`
    # (que barra .git e .env) casaria antes e devolveria 403.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        access_log off;
    }

    # --- HTML: sempre revalida -------------------------------------------
    location / {
        include /etc/nginx/snippets/porkinho-seguranca.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    # --- paginas de erro no visual do site -------------------------------
    error_page 404 /404.html;
    location = /404.html { internal; include /etc/nginx/snippets/porkinho-seguranca.conf; add_header Cache-Control "no-store" always; }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html { internal; include /etc/nginx/snippets/porkinho-seguranca.conf; add_header Cache-Control "no-store" always; }

    # nao servir arquivo escondido (.git, .env e afins)
    location ~ /\. { deny all; access_log off; log_not_found off; }
}
