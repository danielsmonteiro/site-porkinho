# ------------------------------------------------------------------------
# Feijoada Porkinho — feijoadaporkinho.com.br
# Instalar em: /etc/nginx/sites-available/feijoadaporkinho.com.br.conf
#              ln -s para /etc/nginx/sites-enabled/
#
# Depende de:
#   /etc/nginx/conf.d/cloudflare-realip.conf   (gerado por update-cloudflare-ips.sh)
#   /etc/nginx/conf.d/log-cliques.conf         (log_format, contexto http)
#   /etc/nginx/snippets/cliques.conf           (rotas /go/, contexto server)
#
# CERTIFICADO
# O certificado e um Cloudflare Origin Certificate, valido APENAS para
# conexoes vindas da Cloudflare. Abrir https://209.61.36.237 direto no
# navegador vai acusar certificado invalido — isso e esperado e correto.
# Nao instale Certbot/Let's Encrypt aqui: e redundante e o desafio HTTP-01
# briga com o proxy laranja.
#
# NGINX 1.25.1+: trocar `listen 443 ssl http2;` por `listen 443 ssl;` mais
# `http2 on;`. Este arquivo esta escrito para o nginx 1.24 do Ubuntu 24.04.
# ------------------------------------------------------------------------

# === catch-all: Host desconhecido nao recebe resposta ====================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    return 444;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    # recusa o handshake TLS sem precisar de certificado proprio
    ssl_reject_handshake on;
    access_log off;
    return 444;
}

# === :80 -> :443 =========================================================
server {
    listen 80;
    listen [::]:80;
    server_name feijoadaporkinho.com.br www.feijoadaporkinho.com.br;

    access_log /var/log/nginx/feijoadaporkinho.access.log porkinho;
    error_log  /var/log/nginx/feijoadaporkinho.error.log warn;

    location = /health {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    return 301 https://feijoadaporkinho.com.br$request_uri;
}

# === www -> apex =========================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.feijoadaporkinho.com.br;

    ssl_certificate     /etc/ssl/cloudflare/feijoadaporkinho.com.br.pem;
    ssl_certificate_key /etc/ssl/cloudflare/feijoadaporkinho.com.br.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Authenticated Origin Pulls (recomendado) — LIGAR EM DOIS PASSOS.
    # 1) Painel: SSL/TLS > Origin Server > Authenticated Origin Pulls = ON
    # 2) so entao descomentar as duas linhas abaixo e recarregar o nginx.
    # Na ordem invertida o nginx passa a recusar todo mundo, inclusive a
    # Cloudflare, e o site cai.
    # ssl_client_certificate /etc/ssl/cloudflare/origin-pull-ca.pem;
    # ssl_verify_client on;

    access_log /var/log/nginx/feijoadaporkinho.access.log porkinho;

    return 301 https://feijoadaporkinho.com.br$request_uri;
}

# === o site ==============================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name feijoadaporkinho.com.br;

    root  /var/www/feijoadaporkinho/public;
    index index.html;
    charset utf-8;

    # --- TLS -------------------------------------------------------------
    ssl_certificate     /etc/ssl/cloudflare/feijoadaporkinho.com.br.pem;
    ssl_certificate_key /etc/ssl/cloudflare/feijoadaporkinho.com.br.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Authenticated Origin Pulls (recomendado) — ver a nota no bloco do www:
    # ligue primeiro no painel da Cloudflare, so depois descomente aqui.
    # ssl_client_certificate /etc/ssl/cloudflare/origin-pull-ca.pem;
    # ssl_verify_client on;

    # --- logs ------------------------------------------------------------
    access_log /var/log/nginx/feijoadaporkinho.access.log porkinho;
    error_log  /var/log/nginx/feijoadaporkinho.error.log warn;

    # --- cabecalhos de seguranca -----------------------------------------
    # HSTS: so ligar depois de confirmar que o HTTPS esta redondo. Uma vez
    # enviado, o navegador guarda por 2 anos e nao tem como voltar atras.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://cloudflareinsights.com; img-src 'self' data:; font-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; manifest-src 'self'" always;
    add_header X-Robots-Tag "index, follow" always;

    # --- compressao ------------------------------------------------------
    # Brotli fica por conta da Cloudflare; aqui so o gzip.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   512;
    gzip_proxied      any;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/manifest+json image/svg+xml
               application/xml application/rss+xml;

    # --- saude -----------------------------------------------------------
    location = /health {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # --- contagem de cliques ---------------------------------------------
    # Tem que vir ANTES dos locations de estatico: os `location =` e `^~`
    # de /go/ ganham de qualquer regex, mas manter aqui deixa a leitura clara.
    include /etc/nginx/snippets/cliques.conf;

    # --- estaticos com hash/querystring: cache longo ---------------------
    location ^~ /css/    { expires 1y; add_header Cache-Control "public, max-age=31536000, immutable" always; access_log off; }
    location ^~ /js/     { expires 1y; add_header Cache-Control "public, max-age=31536000, immutable" always; access_log off; }
    location ^~ /img/    { expires 1y; add_header Cache-Control "public, max-age=31536000, immutable" always; access_log off; }
    location ^~ /fonts/  { expires 1y; add_header Cache-Control "public, max-age=31536000, immutable" always; access_log off; types { font/woff2 woff2; } }

    # --- arquivos de raiz que mudam pouco --------------------------------
    location = /favicon.ico    { expires 30d; add_header Cache-Control "public, max-age=2592000" always; access_log off; }
    location = /site.webmanifest { default_type application/manifest+json; expires 1d; add_header Cache-Control "public, max-age=86400" always; }
    location = /robots.txt     { expires 1d; access_log off; }
    location = /sitemap.xml    { expires 1d; access_log off; }

    # --- HTML: sempre revalida -------------------------------------------
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        # os add_header de seguranca precisam ser repetidos: um add_header em
        # bloco filho descarta os herdados do pai.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://cloudflareinsights.com; img-src 'self' data:; font-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; manifest-src 'self'" always;
        try_files $uri $uri/ =404;
    }

    # --- paginas de erro no visual do site -------------------------------
    error_page 404 /404.html;
    location = /404.html { internal; add_header Cache-Control "no-store" always; }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html { internal; add_header Cache-Control "no-store" always; }

    # nao servir arquivo escondido (.git, .env e afins)
    location ~ /\. { deny all; access_log off; log_not_found off; }
}
