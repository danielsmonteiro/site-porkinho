# --- eventos internos ----------------------------------------------------
# Nao levam a lugar nenhum: so registram a linha e respondem 204.
# Usados por public/js/app.js com fetch(..., {keepalive:true}).
#   /go/evento/geolocalizacao?r=sucesso|negado|erro
#   /go/evento/cardapio?r=aberto

location ^~ /go/evento/ {
    access_log /var/log/feijoadaporkinho/cliques.log cliques;
    include /etc/nginx/snippets/porkinho-seguranca.conf;
    add_header Cache-Control "no-store" always;
    return 204;
}

# --- qualquer outra coisa em /go/ ----------------------------------------
# Registra (ajuda a achar link velho circulando por ai) e devolve 404.

location ^~ /go/ {
    access_log /var/log/feijoadaporkinho/cliques.log cliques;
    include /etc/nginx/snippets/porkinho-seguranca.conf;
    add_header Cache-Control "no-store" always;
    return 404;
}
