# ------------------------------------------------------------------------
# Feijoada Porkinho — contagem de cliques pelo proprio nginx
# Instalar em: /etc/nginx/snippets/cliques.conf
# Incluir de dentro do bloco `server` do site (contexto server).
#
# Depende de:
#   /etc/nginx/conf.d/log-cliques.conf        formato do log (contexto http)
#   /etc/nginx/snippets/porkinho-seguranca.conf  cabecalhos de seguranca
#
# O include de seguranca aparece em toda location porque estas definem
# add_header, e um add_header em bloco filho descarta os herdados do pai.
#
# COMO FUNCIONA
# Todo link de saida do site aponta para uma rota interna /go/*. O nginx
# registra a linha no log e devolve 302 para o destino real. Funciona com
# JavaScript desabilitado e nao perde evento quando o navegador troca para
# o aplicativo do iFood ou do 99 Food.
#
# REGRAS QUE NAO PODEM MUDAR
#  - 302, nunca 301. O 301 fica no cache do navegador e a partir do segundo
#    clique o servidor deixa de ser consultado: a contagem para.
#  - Cache-Control: no-store em todo o /go/.
#  - No painel da Cloudflare e preciso uma Cache Rule com "Bypass cache"
#    para /go/*, senao a borda responde do cache e o clique nao chega aqui.
#
# TROCAR UM LINK
# Os destinos abaixo sao copia literal do SITE_DATA de public/js/app.js.
# Ao trocar um link e preciso editar os DOIS lugares (mais o atributo title
# e o JSON-LD do index.html) e recarregar o nginx:
#     sudo nginx -t && sudo systemctl reload nginx
# ------------------------------------------------------------------------

# --- canais de venda -----------------------------------------------------

location = /go/ifood {
    access_log /var/log/feijoadaporkinho/cliques.log cliques;
    include /etc/nginx/snippets/porkinho-seguranca.conf;
    add_header Cache-Control "no-store" always;
    return 302 "https://www.ifood.com.br/delivery/fortaleza-ce/feijoada-porkinho-sapiranga-coite/e4f431c8-ba2c-4a49-bd00-99dbea2c594e?utm_medium=share";
}

