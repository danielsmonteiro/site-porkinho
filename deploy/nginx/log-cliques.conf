# ------------------------------------------------------------------------
# Feijoada Porkinho — formatos de log (contexto http)
# Instalar em: /etc/nginx/conf.d/log-cliques.conf
#
# POR QUE ESTE ARQUIVO EXISTE SEPARADO DE cliques.conf:
# a diretiva `log_format` so e valida no contexto http, e blocos `location`
# so sao validos no contexto server. Como os dois nao cabem no mesmo include,
# o formato fica aqui (conf.d/, que o nginx.conf inclui dentro de http) e as
# rotas ficam em snippets/cliques.conf (incluido dentro do server).
# ------------------------------------------------------------------------

# Log de cliques. Separado por TAB para que user-agent e referer, que contem
# espacos, nao atrapalhem o awk do relatorio.
# Campos: 1 horario | 2 request_uri | 3 status | 4 ip_real | 5 ip_cf_header
#         6 pais | 7 referer | 8 user-agent | 9 cf-ray
log_format cliques '$time_iso8601\t$request_uri\t$status\t$remote_addr\t'
                   '$http_cf_connecting_ip\t$http_cf_ipcountry\t$http_referer\t'
                   '$http_user_agent\t$http_cf_ray';

# Log geral do site, tambem com o IP real e o identificador da requisicao
# na borda da Cloudflare (util para abrir chamado).
log_format porkinho '$time_iso8601 $remote_addr "$http_cf_connecting_ip" '
                    '$http_cf_ipcountry "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$request_time '
                    'ray=$http_cf_ray';

# ------------------------------------------------------------------------
# LGPD — anonimizacao do IP (opcional, deixada desligada de proposito).
#
# O IP e dado pessoal. Hoje ele e mantido por 30 dias e depois apagado pelo
# logrotate. Se preferir nao guardar o IP completo, descomente o `map` abaixo
# e troque `$remote_addr` por `$ip_anon` nos dois log_format acima.
#
# O mascaramento perde precisao geografica, mas continua servindo para
# distinguir visitantes diferentes de forma aproximada.
# ------------------------------------------------------------------------
# map $remote_addr $ip_anon {
#     # IPv4: zera o ultimo octeto -> 189.45.77.0
#     "~^(?<v4>\d+\.\d+\.\d+)\.\d+$"                 "$v4.0";
#     # IPv6: mantem apenas o prefixo /48 -> 2804:14c:65::
#     "~^(?<v6>[0-9a-fA-F]+:[0-9a-fA-F]+:[0-9a-fA-F]+):"  "$v6::";
#     default                                         "0.0.0.0";
# }
